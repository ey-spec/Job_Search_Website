<!DOCTYPE html>
<html lang="en">
<head>
    <title>CareerLink - Browse Jobs</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="../images/icon_dark.png">
</head>
<body>

<nav>
    <div class="nav-container">
        <div class="nav-logo">
            <a href="../SHARED/index.html">
                <img src="../images/logo.png" alt="CareerLink Logo">
            </a>
        </div>
        <div class="nav-links">
            <a href="../USER/jobs.html">Browse Jobs</a>
            <a href="../USER/applied-jobs.html">Applied Jobs</a>
            <a href="../SHARED/index.html" id="logout-btn">Logout</a>
        </div>
    </div>
</nav>

<main>
    <div class="jobs-container">

        <h1>Browse All Jobs</h1>

        <!-- Search bar — JS will handle filtering -->
        <div class="search-bar">
            <input type="text" id="search-input" 
            placeholder="Search by job title or years of experience...">
            <select id="search-filter">
                <option value="title">Job Title</option>
                <option value="experience">Years of Experience</option>
            </select>
            <button type="button" id="search-btn">Search</button>
        </div>

        <!-- JS will fill this with results info -->
        <p id="search-results-info" class="search-results-info"></p>

        <div class="jobs-grid" id="jobs-grid">

        </div>
    </div>
</main>

<footer>
    <div class="footer-content">
        <div class="footer-brand">
            <p>Linking talent with opportunity.</p>
            <div class="footer-socials">
                <a href="#"><i class="fa-brands fa-linkedin"></i></a>
                <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
            </div>
        </div>
        <div class="footer-nav">
            <a href="../USER/jobs.html">Browse Jobs</a>
            <a href="../SHARED/about.html">About</a>
            <a href="../SHARED/terms.html">Terms</a>
            <a href="../SHARED/login.html">Login</a>
            <a href="../SHARED/signup.html">Sign Up</a>
            <a href="mailto:eyadh3415@gmail.com">Contact Us</a>
        </div>
    </div>
    <div class="footer-bottom">
        <p>© 2026 CareerLink. All rights reserved.</p>
    </div>
</footer>
<script src="../main.js"></script>
</body>
</html>
