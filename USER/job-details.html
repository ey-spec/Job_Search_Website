<!DOCTYPE html>
<html lang="en">
<head>
    <title>CareerLink - Job Details</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="../images/icon_dark.png">
</head>
<body>

<nav>
    <div class="nav-container">
        <div class="nav-logo">
            <a href="../SHARED/index.html">
                <img src="../images/logo.png" alt="CareerLink Logo">
            </a>
        </div>
        <div class="nav-links"></div>
    </div>
</nav>

<main>
    <div class="container">
        <div class="job-details-box" id="job-details-box">
            <h1 id="job-title"></h1>
            <div class="job-info">
                <p><strong>Company:</strong> 
                    <span id="job-company">Google</span>
                </p>
                <p><strong>Salary:</strong> 
                    <span id="job-salary"></span>
                </p>
                <p><strong>Years of Experience:</strong> 
                    <span id="job-experience"></span>
                </p>
                <p><strong>Status:</strong> 
                    <span id="job-status"></span>
                </p>
            </div>

            <div class="job-description">
                <h2>Job Description</h2>
                <p id="job-description"></p>
            </div>

            <div class="job-actions">
                <a href="applied-jobs.html" id="apply-btn">Apply Now</a>
                <a href="#" id="save-btn"><i class="fa-solid fa-bookmark"></i> Save Job</a>
                <a href="jobs.html" id="back-btn">Back to Jobs</a>
            </div>

        </div>
    </div>
</main>

<footer>
    <div class="footer-content">
        <div class="footer-brand">
            <p>Linking talent with opportunity.</p>
            <div class="footer-socials">
                <a href="#"><i class="fa-brands fa-linkedin"></i></a>
                <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
            </div>
        </div>
        <div class="footer-nav">
            <a href="../USER/jobs.html">Browse Jobs</a>
            <a href="../SHARED/about.html">About</a>
            <a href="../SHARED/terms.html">Terms</a>
            <a href="../SHARED/login.html">Login</a>
            <a href="../SHARED/signup.html">Sign Up</a>
            <a href="mailto:eyadh3415@gmail.com">Contact Us</a>
        </div>
    </div>
    <div class="footer-bottom">
        <p>© 2026 CareerLink. All rights reserved.</p>
    </div>
</footer>
<script src="../main.js"></script>
</body>
</html>
