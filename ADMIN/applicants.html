<!DOCTYPE html>
<html lang="en">
<head>
    <title>CareerLink - Applicants</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="../images/icon_dark.png">
</head>
<body>

<nav>
    <div class="nav-container">
        <div class="nav-logo">
            <a href="../SHARED/index.html">
                <img src="../images/logo.png" alt="CareerLink Logo">
            </a>
        </div>
        <div class="nav-links">
            <a href="../ADMIN/admin-dashboard.html">My Jobs</a>
            <a href="../ADMIN/add-job.html">Add Job</a>
            <a href="../USER/profile.html">Profile</a>
            <a href="../SHARED/index.html" id="logout-btn">Logout</a>
        </div>
    </div>
</nav>

<main>
    <div class="applicants-container">

        <div class="applicants-header">
            <a href="../ADMIN/admin-dashboard.html" class="back-link">
                <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
            </a>
            <h1 id="applicants-job-title">Applicants</h1>
            <p id="applicants-job-meta" class="applicants-meta"></p>
        </div>

        <!-- Empty state -->
        <div id="no-applicants" class="empty-state" style="display:none;">
            <i class="fa-solid fa-users"></i>
            <p>No one has applied to this job yet.</p>
            <a href="../ADMIN/admin-dashboard.html">Back to Dashboard</a>
        </div>

        <!-- Applicants table -->
        <div id="applicants-table-wrap" style="display:none;">
            <div class="applicants-count" id="applicants-count"></div>
            <table class="applicants-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Applied For</th>
                    </tr>
                </thead>
                <tbody id="applicants-tbody"></tbody>
            </table>
        </div>

    </div>
</main>

<footer>
    <div class="footer-content">
        <div class="footer-brand">
            <p>Linking talent with opportunity.</p>
            <div class="footer-socials">
                <a href="#"><i class="fa-brands fa-linkedin"></i></a>
                <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
            </div>
        </div>
        <div class="footer-nav">
            <a href="../USER/jobs.html">Browse Jobs</a>
            <a href="../SHARED/about.html">About</a>
            <a href="../SHARED/terms.html">Terms</a>
            <a href="../SHARED/login.html">Login</a>
            <a href="../SHARED/signup.html">Sign Up</a>
            <a href="mailto:eyadh3415@gmail.com">Contact Us</a>
        </div>
    </div>
    <div class="footer-bottom">
        <p>© 2026 CareerLink. All rights reserved.</p>
    </div>
</footer>

<script src="../main.js"></script>
</body>
</html>
